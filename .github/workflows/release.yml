name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Test and pack packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Validate release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f ".releases/${VERSION}.md"
          test "$(node -p "require('./typescript/package.json').version")" = "$VERSION"
          grep -Fq "<Version>${VERSION}</Version>" dotnet/Barchart.BinarySerializer/Barchart.BinarySerializer.csproj

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Test TypeScript
        working-directory: typescript
        run: |
          yarn lint
          yarn test
          yarn build

      - name: Test .NET
        run: |
          dotnet restore dotnet/Barchart.BinarySerializer.sln
          dotnet test dotnet/Barchart.BinarySerializer.sln --configuration Release --no-restore

      - name: Pack NuGet package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack dotnet/Barchart.BinarySerializer/Barchart.BinarySerializer.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="${VERSION}" \
            --output artifacts/nuget

      - name: Pack npm package
        working-directory: typescript
        run: |
          mkdir -p ../artifacts/npm
          npm pack --pack-destination ../artifacts/npm

      - name: Upload unsigned NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-nuget-package
          path: artifacts/nuget/*.nupkg

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm/*.tgz

  sign:
    name: Sign package
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download unsigned package
        uses: actions/download-artifact@v4
        with:
          name: unsigned-nuget-package
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install signing tools
        shell: pwsh
        run: dotnet tool install --tool-path tools --version 0.9.1-beta.26431.1 sign

      - name: Login to Azure
        uses: azure/login@v3
        with:
          allow-no-subscriptions: true
          enable-AzPSSession: true
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Sign package
        uses: azure/powershell@v3
        env:
          SIGNING_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
        with:
          azPSVersion: latest
          inlineScript: |
            ./tools/sign code artifact-signing *.nupkg `
              -ase $env:SIGNING_ENDPOINT `
              -asa $env:SIGNING_ACCOUNT `
              -ascp $env:SIGNING_CERTIFICATE_PROFILE `
              -act azure-powershell `
              --base-directory "${{ github.workspace }}/artifacts/nuget"

      - name: Verify package signature
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/nuget/*.nupkg
          dotnet nuget verify --all $package.FullName

      - name: Upload signed package
        uses: actions/upload-artifact@v4
        with:
          name: signed-nuget-package
          path: artifacts/nuget/*.nupkg

  publish-nuget:
    name: Publish NuGet package
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download signed package
        uses: actions/download-artifact@v4
        with:
          name: signed-nuget-package
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Authenticate with NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >
          dotnet nuget push artifacts/nuget/*.nupkg
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-npm:
    name: Publish npm package
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          scope: '@barchart'

      - name: Publish package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ $(npm view "@barchart/binary-serializer-ts@${VERSION}" version 2>/dev/null || true) != "$VERSION" ]]; then
            npm publish artifacts/npm/*.tgz --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

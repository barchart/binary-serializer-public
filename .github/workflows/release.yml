name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Test and pack packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: typescript/yarn.lock

      - name: Validate release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -f ".releases/${VERSION}.md"
          test "$(node -p "require('./typescript/package.json').version")" = "$VERSION"
          grep -Fq "<Version>${VERSION}</Version>" dotnet/Barchart.BinarySerializer/Barchart.BinarySerializer.csproj

      - name: Install TypeScript dependencies
        working-directory: typescript
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Test TypeScript
        working-directory: typescript
        run: |
          yarn lint
          yarn test
          yarn build

      - name: Test .NET
        run: |
          dotnet restore dotnet/Barchart.BinarySerializer.sln
          dotnet test dotnet/Barchart.BinarySerializer.sln --configuration Release --no-restore

      - name: Pack NuGet package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack dotnet/Barchart.BinarySerializer/Barchart.BinarySerializer.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="${VERSION}" \
            --output artifacts/nuget

      - name: Pack npm package
        working-directory: typescript
        run: |
          mkdir -p ../artifacts/npm
          npm pack --pack-destination ../artifacts/npm

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm/*.tgz

  publish-nuget:
    name: Publish NuGet package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Authenticate with NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        run: >
          dotnet nuget push artifacts/nuget/*.nupkg
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  publish-npm:
    name: Publish npm package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: artifacts/npm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          scope: '@barchart'

      - name: Publish package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ $(npm view "@barchart/binary-serializer-ts@${VERSION}" version 2>/dev/null || true) != "$VERSION" ]]; then
            npm publish artifacts/npm/*.tgz --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
